<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Account Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f9fa;
      color: #2b303a;
    }
    .header-bg { background-color: #8fa3b0; }
    .btn-primary { background-color: #3b5249; color: #ffffff; }
    .btn-primary:hover { background-color: #2c3e37; }
    .card-border { border-color: #e2e8f0; }
    .text-sage { color: #3b5249; }
    .bg-sage-light { background-color: #f0f4f1; }
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body class="pb-20">

  <!-- パスワード認証画面 -->
  <div id="auth-screen" class="fixed inset-0 bg-slate-800 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl text-center">
      <div class="w-16 h-16 rounded-2xl overflow-hidden mx-auto shadow-md border border-gray-100 flex items-center justify-center bg-slate-100">
        <!-- 樹木アイコン (SVG) -->
        <svg viewBox="0 0 100 100" class="w-full h-full">
          <rect width="100" height="100" fill="#a4b8c4"/>
          <ellipse cx="40" cy="55" rx="18" ry="25" fill="#d3bd7a"/>
          <ellipse cx="50" cy="40" rx="20" ry="28" fill="#e2d49e"/>
          <ellipse cx="62" cy="52" rx="20" ry="26" fill="#5b7b63"/>
          <rect x="39" y="70" width="2" height="20" fill="#4a4a4a"/>
          <rect x="49" y="60" width="2" height="30" fill="#4a4a4a"/>
          <rect x="61" y="68" width="2" height="22" fill="#4a4a4a"/>
          <rect x="0" y="88" width="100" height="12" fill="#3b5249"/>
        </svg>
      </div>
      <div>
        <h2 class="text-lg font-bold text-gray-800">Household Account Book</h2>
        <p class="text-xs text-gray-500 mt-1">パスワードを入力してログインしてください</p>
      </div>
      <form onsubmit="verifyPassword(event)" class="space-y-3">
        <input type="password" id="input-pass" placeholder="パスワードを入力" required autocomplete="current-password" class="w-full p-3 border border-gray-300 rounded-xl text-center font-bold tracking-widest bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600">
        <p id="auth-error" class="text-xs text-red-500 hidden font-bold">パスワードが正しくありません</p>
        <button type="submit" class="w-full btn-primary font-bold py-3 rounded-xl text-sm shadow transition">
          解除して開く
        </button>
      </form>
    </div>
  </div>

  <!-- アプリ本体 -->
  <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative hidden">
    <header class="header-bg text-white p-4 sticky top-0 z-20 shadow-md">
      <h1 class="text-xl font-bold tracking-wide text-center mb-3 nowrap">
        Household Account Book
      </h1>
      <div class="flex items-center justify-between gap-2 border-t border-white/20 pt-3">
        <div id="period-selector" class="flex items-center bg-black/15 rounded-lg p-1 text-xs font-semibold">
          <button id="mode-month" onclick="setPeriodMode('month')" class="px-3 py-1 rounded-md bg-white text-gray-800 shadow-sm transition">月別</button>
          <button id="mode-year" onclick="setPeriodMode('year')" class="px-3 py-1 rounded-md text-white/90 hover:text-white transition">年別</button>
        </div>
        <div class="flex items-center gap-2 bg-black/15 rounded-lg px-2 py-1 text-sm font-medium">
          <button onclick="changePeriod(-1)" class="p-1 hover:bg-white/20 rounded-full transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          <span id="current-period-display" class="font-bold min-w-[90px] text-center">2026年10月</span>
          <button onclick="changePeriod(1)" class="p-1 hover:bg-white/20 rounded-full transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
      </div>
    </header>

    <main class="p-4 space-y-6">
      <section id="tab-dashboard" class="space-y-5">
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-blue-50/80 p-3 rounded-2xl border border-blue-100">
            <p class="text-xs text-gray-500 font-semibold mb-1">収入</p>
            <p id="total-income" class="text-sm font-bold text-blue-700">¥0</p>
          </div>
          <div class="bg-red-50/80 p-3 rounded-2xl border border-red-100">
            <p class="text-xs text-gray-500 font-semibold mb-1">支出</p>
            <p id="total-expense" class="text-sm font-bold text-red-600">¥0</p>
          </div>
          <div class="bg-emerald-50/80 p-3 rounded-2xl border border-emerald-100">
            <p class="text-xs text-gray-500 font-semibold mb-1">収支</p>
            <p id="total-balance" class="text-sm font-bold text-emerald-700">¥0</p>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-bold text-gray-700 flex items-center gap-1.5 text-sm">
              <i data-lucide="target" class="w-4 h-4 text-sage"></i> 予算進捗・管理
            </h3>
            <button onclick="openBudgetModal()" class="text-xs text-sage font-bold hover:underline flex items-center gap-1">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 予算設定
            </button>
          </div>
          <div id="budget-progress-container" class="space-y-3 text-xs"></div>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm">
          <h3 class="font-bold text-gray-700 mb-3 text-sm flex items-center gap-1.5">
            <i data-lucide="pie-chart" class="w-4 h-4 text-sage"></i> 支出カテゴリ内訳
          </h3>
          <div class="h-56 relative"><canvas id="categoryChart"></canvas></div>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm">
          <h3 id="bar-chart-title" class="font-bold text-gray-700 mb-3 text-sm flex items-center gap-1.5">
            <i data-lucide="bar-chart-3" class="w-4 h-4 text-sage"></i> 日別収支推移
          </h3>
          <div class="h-48 relative"><canvas id="trendChart"></canvas></div>
        </div>
      </section>

      <section id="tab-history" class="space-y-5 hidden">
        <div class="bg-sage-light p-4 rounded-2xl border border-emerald-900/10 space-y-3 shadow-sm">
          <h3 class="font-bold text-sage text-sm flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> 収支を入力
          </h3>
          <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-3">
            <div class="flex gap-2">
              <label class="flex-1 text-center py-2 rounded-xl border bg-white cursor-pointer has-[:checked]:bg-red-500 has-[:checked]:text-white font-bold text-xs shadow-sm transition">
                <input type="radio" name="type" value="expense" checked onchange="updateCategoryOptions()" class="hidden"> 支出
              </label>
              <label class="flex-1 text-center py-2 rounded-xl border bg-white cursor-pointer has-[:checked]:bg-blue-600 has-[:checked]:text-white font-bold text-xs shadow-sm transition">
                <input type="radio" name="type" value="income" onchange="updateCategoryOptions()" class="hidden"> 収入
              </label>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="date" id="input-date" required class="w-full p-2.5 border rounded-xl text-xs bg-white">
              <input type="number" id="input-amount" placeholder="金額 (円)" required class="w-full p-2.5 border rounded-xl text-xs bg-white">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <select id="input-main-cat" onchange="updateSubCatOptions()" required class="w-full p-2.5 border rounded-xl text-xs bg-white"><option value="">大項目を選択</option></select>
              <select id="input-sub-cat" required class="w-full p-2.5 border rounded-xl text-xs bg-white"><option value="">小項目を選択</option></select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <select id="input-payer" class="w-full p-2.5 border rounded-xl text-xs bg-white">
                <option value="しゅう">支払者: しゅう</option>
                <option value="りの">支払者: りの</option>
              </select>
              <select id="input-paymethod" class="w-full p-2.5 border rounded-xl text-xs bg-white">
                <option value="しゅうカード">方法: しゅうカード</option>
                <option value="りのカード">方法: りのカード</option>
                <option value="家族カード">方法: 家族カード</option>
                <option value="現金">方法: 現金</option>
              </select>
            </div>
            <input type="text" id="input-memo" placeholder="メモ（任意）" class="w-full p-2.5 border rounded-xl text-xs bg-white">
            <button type="submit" class="w-full btn-primary font-bold py-2.5 rounded-xl text-xs shadow transition">登録する</button>
          </form>
        </div>

        <div id="settlement-container" class="space-y-4">
          <div class="bg-amber-50/90 p-4 rounded-2xl border border-amber-200/80 shadow-sm">
            <h3 class="font-bold text-amber-900 text-sm flex items-center justify-between border-b border-amber-200 pb-2 mb-2">
              <span class="flex items-center gap-1.5"><i data-lucide="calculator" class="w-4 h-4 text-amber-700"></i> 立替・精算計算</span>
            </h3>
            <div class="flex justify-between items-end mt-2">
              <span class="text-xs text-amber-800 font-medium">精算対象金額</span>
              <span id="settlement-amount" class="text-xl font-bold text-amber-900">¥0</span>
            </div>
          </div>
          <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
            <h3 class="font-bold text-gray-700 text-sm flex items-center gap-1.5 border-b pb-2">
              <i data-lucide="credit-card" class="w-4 h-4 text-sage"></i> 支払者別 × 支払い方法別 合計
            </h3>
            <div id="paymatrix-summary" class="overflow-x-auto text-xs"></div>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
          <h3 class="font-bold text-gray-700 text-sm flex items-center gap-1.5 border-b pb-2">
            <i data-lucide="layers" class="w-4 h-4 text-sage"></i> カテゴリ別集計
          </h3>
          <div id="category-summary-list" class="space-y-2 text-xs"></div>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
          <h3 class="font-bold text-gray-700 text-sm border-b pb-2 flex items-center gap-1.5">
            <i data-lucide="history" class="w-4 h-4 text-sage"></i> 履歴一覧
          </h3>
          <div id="transaction-list" class="space-y-2 divide-y text-xs"></div>
        </div>
      </section>

      <section id="tab-savings" class="space-y-5 hidden">
        <div class="bg-emerald-800 text-white p-5 rounded-2xl shadow-md space-y-2">
          <p class="text-xs text-emerald-200 font-medium">現在の総貯蓄累計額</p>
          <p id="total-savings-amount" class="text-2xl font-bold tracking-tight">¥0</p>
        </div>

        <div class="space-y-3">
          <h3 class="font-bold text-gray-700 text-sm flex items-center gap-1.5">
            <i data-lucide="piggy-bank" class="w-4 h-4 text-sage"></i> 目的別貯金
          </h3>
          <div id="savings-goals-list" class="space-y-3"></div>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
          <h3 class="font-bold text-gray-700 text-sm flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-4 h-4 text-sage"></i> 貯金・取崩しの記録
          </h3>
          <form id="savings-form" onsubmit="addSavingsRecord(event)" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <select id="savings-goal-select" required class="w-full p-2.5 border rounded-xl text-xs bg-white"></select>
              <select id="savings-type" class="w-full p-2.5 border rounded-xl text-xs bg-white">
                <option value="deposit">貯金 (+)</option>
                <option value="withdraw">取崩し (-)</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="date" id="savings-date" required class="w-full p-2.5 border rounded-xl text-xs bg-white">
              <input type="number" id="savings-amount" placeholder="金額 (円)" required class="w-full p-2.5 border rounded-xl text-xs bg-white">
            </div>
            <input type="text" id="savings-memo" placeholder="メモ（任意）" class="w-full p-2.5 border rounded-xl text-xs bg-white">
            <button type="submit" class="w-full btn-primary font-bold py-2.5 rounded-xl text-xs shadow transition">記録する</button>
          </form>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
          <h3 class="font-bold text-gray-700 text-sm border-b pb-2 flex items-center gap-1.5">
            <i data-lucide="list" class="w-4 h-4 text-sage"></i> 貯金・出金履歴一覧
          </h3>
          <div id="savings-history-list" class="space-y-2 divide-y text-xs"></div>
        </div>
      </section>

      <section id="tab-settings" class="space-y-5 hidden">
        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
          <h3 class="font-bold text-gray-700 text-sm border-b pb-2 flex items-center gap-1.5">
            <i data-lucide="key" class="w-4 h-4 text-sage"></i> パスワード設定
          </h3>
          <button onclick="changeAppPassword()" class="w-full border border-gray-300 font-bold py-2.5 rounded-xl text-xs hover:bg-gray-50 flex items-center justify-center gap-2">
            パスワードの変更
          </button>
        </div>

        <div class="bg-white p-4 rounded-2xl border card-border shadow-sm space-y-3">
          <h3 class="font-bold text-gray-700 text-sm border-b pb-2 flex items-center gap-1.5">
            <i data-lucide="database" class="w-4 h-4 text-sage"></i> データ管理 (CSV)
          </h3>
          <div class="flex flex-col gap-2 pt-2">
            <button onclick="exportCSV()" class="w-full border border-gray-300 font-bold py-2.5 rounded-xl text-xs hover:bg-gray-50 flex items-center justify-center gap-2">
              <i data-lucide="download" class="w-4 h-4"></i> CSVエクスポート
            </button>
            <label class="w-full border border-gray-300 font-bold py-2.5 rounded-xl text-xs hover:bg-gray-50 flex items-center justify-center gap-2 cursor-pointer text-center">
              <i data-lucide="upload" class="w-4 h-4"></i> CSVインポート
              <input type="file" accept=".csv" onchange="importCSV(event)" class="hidden">
            </label>
          </div>
        </div>
      </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around p-2 text-[10px] font-medium text-gray-500 z-20">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-sage font-bold">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>ダッシュ</span>
      </button>
      <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center gap-1">
        <i data-lucide="receipt" class="w-5 h-5"></i><span>明細・入力</span>
      </button>
      <button onclick="switchTab('savings')" id="nav-savings" class="flex flex-col items-center gap-1">
        <i data-lucide="piggy-bank" class="w-5 h-5"></i><span>貯金管理</span>
      </button>
      <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1">
        <i data-lucide="settings" class="w-5 h-5"></i><span>設定</span>
      </button>
    </nav>
  </div>

  <div id="budget-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-4 max-h-[85vh] overflow-y-auto">
      <h3 class="font-bold text-gray-800 text-sm border-b pb-2">月間予算の設定</h3>
      <div id="budget-inputs-container" class="space-y-3 text-xs"></div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeBudgetModal()" class="flex-1 border py-2 rounded-xl text-xs font-bold text-gray-600">キャンセル</button>
        <button onclick="saveBudgets()" class="flex-1 btn-primary py-2 rounded-xl text-xs font-bold">保存する</button>
      </div>
    </div>
  </div>

  <script>
    let APP_PASS = (localStorage.getItem('hab_app_pass') || 'Fuyu').trim().toLowerCase();

    function verifyPassword(e) {
      e.preventDefault();
      const input = document.getElementById('input-pass').value.trim().toLowerCase();
      
      if (input === APP_PASS) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        lucide.createIcons();
        initApp();
      } else {
        document.getElementById('auth-error').classList.remove('hidden');
      }
    }

    function changeAppPassword() {
      const current = prompt('現在のパスワードを入力してください:');
      if (!current || current.trim().toLowerCase() !== APP_PASS) {
        alert('現在のパスワードが一致しません');
        return;
      }
      const newPass = prompt('新しいパスワードを入力してください:');
      if (newPass && newPass.trim() !== '') {
        const rawPass = newPass.trim();
        APP_PASS = rawPass.toLowerCase();
        localStorage.setItem('hab_app_pass', rawPass);
        alert('パスワードを変更しました');
      }
    }

    const CATEGORIES = {
      expense: {
        '固定費': ['家賃'],
        '公共料金': ['水道料金', '電気料金'],
        '食費': ['食料品代', 'おやつ代', '外食代'],
        '雑貨・日用品代': ['消耗品代', '家具家電代', '小物代', '洋服代', '書籍代'],
        '医療費': ['病院代', '薬代'],
        '交通費': ['タクシー代', 'レンタカー代'],
        '特別費': ['子ども関連', '親族関連'],
        'その他': ['立替']
      },
      income: {
        '収入': ['給与', '賞与', '副収入', 'その他収入']
      }
    };

    let transactions = JSON.parse(localStorage.getItem('hab_transactions')) || [];
    let savingsGoals = JSON.parse(localStorage.getItem('hab_savings_goals')) || [
      { id: 'emergency', name: '生活防衛資金', target: 1000000 },
      { id: 'fuyutan', name: 'ふゆたん貯金', target: 500000 },
      { id: 'travel', name: '旅行貯金', target: 300000 }
    ];
    let savingsRecords = JSON.parse(localStorage.getItem('hab_savings_records')) || [];
    let budgets = JSON.parse(localStorage.getItem('hab_budgets')) || { overall: 250000, '食費': 50000, '固定費': 85000 };

    let currentYear = 2026;
    let currentMonth = 10;
    let periodMode = 'month';
    let categoryChartObj = null;
    let trendChartObj = null;

    function initApp() {
      document.getElementById('input-date').valueAsDate = new Date();
      document.getElementById('savings-date').valueAsDate = new Date();
      updateCategoryOptions();
      renderAll();
    }

    function switchTab(tabName) {
      ['dashboard', 'history', 'savings', 'settings'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`nav-${t}`).classList.remove('text-sage', 'font-bold');
      });
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-${tabName}`).classList.add('text-sage', 'font-bold');
      if (tabName === 'dashboard') renderCharts();
    }

    function setPeriodMode(mode) {
      periodMode = mode;
      document.getElementById('mode-month').className = mode === 'm
