<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Account Book</title>
  <!-- Google Sans / Inter フォント参照 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wheatBg: '#f5deb3',
            forestDark: '#2E4D38',
            forestLight: '#4A6B53',
            sageBadge: '#E8F0EC',
            appBg: '#F8F7F2',
            cardBg: '#FFFFFF',
            accentRed: '#D9534F',
            accentRedBg: '#FDF2F2'
          },
          fontFamily: {
            sans: ['Google Sans', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Google Sans', 'Inter', sans-serif;
      background-color: #F8F7F2;
      color: #333333;
      white-space: nowrap;
    }
    .nowrap-single {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- ヘッダー (指定の #f5deb3 カラー) -->
  <header class="bg-wheatBg text-stone-800 pt-4 pb-3 px-4 shadow-sm border-b border-amber-200">
    <div class="max-w-4xl mx-auto space-y-3">
      
      <!-- タイトル (1行表示) -->
      <div class="flex items-center space-x-2">
        <div class="bg-amber-800/10 p-1.5 rounded-lg">
          <svg class="w-6 h-6 text-amber-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-amber-950 nowrap-single">Household Account Book</h1>
      </div>

      <!-- 月別/年別 切替 & 年月ナビゲーション -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
        <!-- モード切替 -->
        <div class="inline-flex bg-amber-900/10 p-1 rounded-xl text-xs font-medium">
          <button id="modeMonthlyBtn" onclick="switchMode('monthly')" class="px-3 py-1.5 rounded-lg bg-white text-stone-900 shadow-sm transition">月別</button>
          <button id="modeYearlyBtn" onclick="switchMode('yearly')" class="px-3 py-1.5 rounded-lg text-stone-700 hover:text-stone-900 transition">年別</button>
        </div>

        <!-- 日付ナビゲーション -->
        <div class="flex items-center bg-amber-900/10 rounded-xl px-2 py-1 space-x-2 text-stone-800">
          <button onclick="changePeriod(-1)" class="p-1 hover:bg-amber-900/10 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          </button>
          <span id="currentPeriodLabel" class="text-xs font-semibold px-1 min-w-[90px] text-center">2026年10月</span>
          <button onclick="changePeriod(1)" class="p-1 hover:bg-amber-900/10 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>
        </div>
      </div>

      <!-- ナビゲーションタブ -->
      <nav class="flex space-x-1 border-t border-amber-900/10 pt-2 overflow-x-auto no-scrollbar">
        <button id="tabDashBtn" onclick="switchTab('dashboard')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-stone-900 shadow-sm whitespace-nowrap">ダッシュボード・予算</button>
        <button id="tabEntryBtn" onclick="switchTab('entry')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 hover:bg-amber-900/10 whitespace-nowrap">⊕ 収支入力</button>
        <button id="tabDetailsBtn" onclick="switchTab('details')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 hover:bg-amber-900/10 whitespace-nowrap">明細</button>
        <button id="tabSavingsBtn" onclick="switchTab('savings')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 hover:bg-amber-900/10 whitespace-nowrap">貯金管理</button>
      </nav>

    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-4xl mx-auto px-4 mt-4 space-y-6">

    <!-- 1. ダッシュボード・予算 タブ -->
    <section id="secDashboard" class="space-y-4">
      
      <!-- サマリーカード -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <!-- 収入 -->
        <div class="bg-cardBg p-4 rounded-2xl border border-stone-200/80 shadow-sm flex justify-between items-center">
          <div>
            <p id="sumIncomeLabel" class="text-xs text-stone-500 font-medium mb-1">今月の総収入</p>
            <p id="sumIncomeVal" class="text-xl font-bold text-stone-800">¥0</p>
          </div>
          <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
          </div>
        </div>

        <!-- 支出 -->
        <div class="bg-cardBg p-4 rounded-2xl border border-stone-200/80 shadow-sm flex justify-between items-center">
          <div>
            <p id="sumExpenseLabel" class="text-xs text-stone-500 font-medium mb-1">今月の総支出</p>
            <p id="sumExpenseVal" class="text-xl font-bold text-stone-800">¥0</p>
          </div>
          <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
          </div>
        </div>

        <!-- 収支バランス -->
        <div class="bg-cardBg p-4 rounded-2xl border border-stone-200/80 shadow-sm flex justify-between items-center">
          <div>
            <p class="text-xs text-stone-500 font-medium mb-1">収支バランス</p>
            <p id="sumBalanceVal" class="text-xl font-bold text-stone-800">¥0</p>
          </div>
          <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 18h12l3-18H3z"></path></svg>
          </div>
        </div>
      </div>

      <!-- 月別表示時：予算管理 -->
      <div id="monthlyBudgetSection" class="bg-cardBg p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span class="text-lg">◎</span>
            <h2 class="text-base font-bold text-stone-800">予算進捗状況</h2>
          </div>
          <button onclick="openBudgetModal()" class="text-xs bg-forestDark hover:bg-forestLight text-white px-3 py-1.5 rounded-xl font-medium transition">
            ⚙ 予算を設定
          </button>
        </div>

        <!-- 全体予算 -->
        <div class="bg-stone-50 p-4 rounded-xl border border-stone-200/60 space-y-2">
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-stone-700">全体予算進捗</span>
            <span id="overallBudgetRatio" class="font-bold text-stone-800">¥0 / ¥0 (0%)</span>
          </div>
          <div class="w-full bg-stone-200 h-3 rounded-full overflow-hidden">
            <div id="overallProgressBar" class="bg-forestDark h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <div class="flex justify-between items-center text-xs text-stone-500 pt-1">
            <span id="overallBudgetRemain">残額: ¥0</span>
            <span id="overallBudgetUsed">消化率: 0%</span>
          </div>
        </div>

        <!-- 大項目ごとの個別予算リスト -->
        <div id="categoryBudgetList" class="space-y-3 pt-2">
          <!-- JSで描画 -->
        </div>
      </div>

      <!-- 年別表示時：年間推移グラフ -->
      <div id="yearlyChartSection" class="bg-cardBg p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-4 hidden">
        <h2 class="text-base font-bold text-stone-800 flex items-center space-x-2">
          <span>📊</span>
          <span>年間収支推移</span>
        </h2>
        <div class="h-64">
          <canvas id="yearlyChart"></canvas>
        </div>
      </div>

    </section>

    <!-- 2. 収支入力 タブ -->
    <section id="secEntry" class="bg-cardBg p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-4 hidden">
      <h2 class="text-base font-bold text-stone-800 flex items-center space-x-2">
        <span>✏️</span>
        <span>収支を記録する</span>
      </h2>

      <form id="transactionForm" onsubmit="handleSaveTransaction(event)" class="space-y-4">
        <!-- 種別 -->
        <div class="grid grid-cols-2 gap-2 p-1 bg-stone-100 rounded-xl text-xs font-semibold">
          <button type="button" id="typeExpenseBtn" onclick="setEntryType('expense')" class="py-2 rounded-lg bg-white text-stone-900 shadow-sm transition">支出</button>
          <button type="button" id="typeIncomeBtn" onclick="setEntryType('income')" class="py-2 rounded-lg text-stone-500 transition">収入</button>
        </div>

        <!-- 日付 -->
        <div>
          <label class="block text-xs font-medium text-stone-600 mb-1">日付</label>
          <input type="date" id="entryDate" required class="w-full text-sm border border-stone-300 rounded-xl p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-forestDark">
        </div>

        <!-- 金額 -->
        <div>
          <label class="block text-xs font-medium text-stone-600 mb-1">金額 (円)</label>
          <input type="number" id="entryAmount" required min="1" placeholder="例: 1200" class="w-full text-sm border border-stone-300 rounded-xl p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-forestDark">
        </div>

        <!-- カテゴリ（大項目・小項目） -->
        <div id="categorySelectGroup" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-stone-600 mb-1">大項目</label>
            <select id="entryMainCat" onchange="updateSubCatOptions()" class="w-full text-sm border border-stone-300 rounded-xl p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-forestDark">
              <!-- JSで動的読み込み -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-stone-600 mb-1">小項目</label>
            <select id="entrySubCat" class="w-full text-sm border border-stone-300 rounded-xl p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-forestDark">
              <!-- JSで動的読み込み -->
            </select>
          </div>
        </div>

        <!-- メモ -->
        <div>
          <label class="block text-xs font-medium text-stone-600 mb-1">メモ (任意)</label>
          <input type="text" id="entryMemo" placeholder="例: スーパーでの買い物" class="w-full text-sm border border-stone-300 rounded-xl p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-forestDark">
        </div>

        <button type="submit" class="w-full bg-forestDark hover:bg-forestLight text-white font-medium py-3 rounded-xl transition text-sm shadow-sm">
          保存する
        </button>
      </form>
    </section>

    <!-- 3. 明細 タブ -->
    <section id="secDetails" class="space-y-4 hidden">
      <!-- 大項目・小項目別の集計表示 -->
      <div class="bg-cardBg p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-3">
        <h2 class="text-base font-bold text-stone-800 flex items-center space-x-2">
          <span>📂</span>
          <span>カテゴリ別合計</span>
        </h2>
        <div id="categorySummaryList" class="space-y-2 text-xs">
          <!-- JSで集計結果を表示 -->
        </div>
      </div>

      <!-- 履歴テーブル -->
      <div class="bg-cardBg p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-3 overflow-hidden">
        <h2 class="text-base font-bold text-stone-800 flex items-center space-x-2">
          <span>📜</span>
          <span>収支履歴明細</span>
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b border-stone-200 text-stone-500 font-medium">
                <th class="py-2 px-2">日付</th>
                <th class="py-2 px-2">区分</th>
                <th class="py-2 px-2">大項目</th>
                <th class="py-2 px-2">小項目</th>
                <th class="py-2 px-2">メモ</th>
                <th class="py-2 px-2 text-right">金額</th>
                <th class="py-2 px-2 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="transactionTableBody" class="divide-y divide-stone-100 text-stone-700">
              <!-- JSで動的表示 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 4. 貯金管理 タブ -->
    <section id="secSavings" class="space-y-4 hidden">
      
      <!-- ヘッダーアクション（改行により重なりを防止） -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <h2 class="text-base font-bold text-stone-800 flex items-center space-x-2">
          <span>🐷</span>
          <span>貯金目標・積立管理</span>
        </h2>
        <div class="flex space-x-2">
          <button onclick="openSavingsRecordModal()" class="text-xs bg-amber-700 hover:bg-amber-800 text-white font-medium px-3 py-2 rounded-xl transition shadow-sm">
            ＋ 貯金・取崩しを記録
          </button>
          <button onclick="openSavingsGoalModal()" class="text-xs bg-forestDark hover:bg-forestLight text-white font-medium px-3 py-2 rounded-xl transition shadow-sm">
            ＋ 新規貯金目標
          </button>
        </div>
      </div>

      <!-- 目標リスト -->
      <div id="savingsGoalList" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- JSで描画 -->
      </div>

      <!-- 貯金・出金履歴一覧 -->
      <div class="bg-cardBg p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-3">
        <h3 class="text-sm font-bold text-stone-800 flex items-center space-x-2">
          <span>🕒</span>
          <span>貯金・出金履歴一覧</span>
        </h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b border-stone-200 text-stone-500 font-medium">
                <th class="py-2 px-2">日付</th>
                <th class="py-2 px-2">貯金目的</th>
                <th class="py-2 px-2">区分</th>
                <th class="py-2 px-2">メモ</th>
                <th class="py-2 px-2 text-right">金額</th>
                <th class="py-2 px-2 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="savingsHistoryBody" class="divide-y divide-stone-100 text-stone-700">
              <!-- JSで描画 -->
            </tbody>
          </table>
        </div>
      </div>

    </section>

  </main>

  <!-- モーダル：予算設定 -->
  <div id="budgetModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl p-5 max-w-md w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2
